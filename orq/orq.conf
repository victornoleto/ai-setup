# orq — padrões. Precedência, do mais fraco ao mais forte:
#   este arquivo → variável de ambiente → <fila>/queue.conf → flags (--account, --repo).
# Cada linha daqui só atribui se a variável ainda não tem valor (${VAR:=valor}).

# Conta: 1 = xclaude (~/.claude), 2 = xclaude2 (~/.claude2). Os aliases do ~/.bashrc não valem em script;
# o orq faz o mesmo que eles: CLAUDE_CONFIG_DIR + --dangerously-skip-permissions.
: "${ORQ_ACCOUNT:=2}"
: "${ORQ_ACCOUNT_DIR_1:=$HOME/.claude}"
: "${ORQ_ACCOUNT_DIR_2:=$HOME/.claude2}"
# Vazio: no limite de uso, espera o reset. 1 ou 2: troca para essa conta.
: "${ORQ_FALLBACK_ACCOUNT:=}"

# Papéis. A conta de cada papel cai no ORQ_ACCOUNT quando vazia.
: "${ORQ_PLANNER_MODEL:=claude-opus-5-5}"   ; : "${ORQ_PLANNER_EFFORT:=high}"   ; : "${ORQ_PLANNER_ACCOUNT:=}"
: "${ORQ_EXECUTOR_MODEL:=claude-sonnet-5}"  ; : "${ORQ_EXECUTOR_EFFORT:=high}"  ; : "${ORQ_EXECUTOR_ACCOUNT:=}"
: "${ORQ_REVIEWER_MODEL:=$ORQ_PLANNER_MODEL}" ; : "${ORQ_REVIEWER_EFFORT:=$ORQ_PLANNER_EFFORT}" ; : "${ORQ_REVIEWER_ACCOUNT:=}"
: "${ORQ_VOTER_MODEL:=claude-opus-5-5}"     ; : "${ORQ_VOTER_EFFORT:=high}"     ; : "${ORQ_VOTER_ACCOUNT:=}"
: "${ORQ_TIEBREAK_MODEL:=claude-opus-5-5}"  ; : "${ORQ_TIEBREAK_EFFORT:=max}"   ; : "${ORQ_TIEBREAK_ACCOUNT:=}"
: "${ORQ_VOTERS:=3}"

# Laço.
: "${ORQ_MAX_CYCLES:=3}"            # execuções do executor revisadas antes de o planejador assumir
: "${ORQ_MAX_DECISION_ROUNDS:=5}"   # rodadas de conselho por tarefa (trava contra laço de dúvidas)
: "${ORQ_ON_FAIL:=stop}"            # stop | continue

# Tempo.
: "${ORQ_CALL_TIMEOUT:=4h}"         # por chamada ao claude (sintaxe do `timeout`)
: "${ORQ_LIMIT_MAX_WAIT:=8h}"       # espera total máxima por limite de uso, por chamada
: "${ORQ_LIMIT_POLL:=30m}"          # espera quando a mensagem não traz o horário do reset

# Fila.
: "${ORQ_REPO:=}"                   # diretório de trabalho das sessões; vazio = o diretório atual
: "${ORQ_RULES_FILE:=}"             # regras anexadas a todo prompt (caminho relativo à fila)

# Só para teste: força a revisão a reprovar (exercita o takeover).
: "${ORQ_TEST_FORCE_CHANGES:=0}"

# Terminal: o que do stream do claude aparece ao vivo. main = planejador, executor e revisor (votantes em
# silêncio: são 3 em paralelo) · all · none. ORQ_STREAM_THINKING=1 mostra também o raciocínio.
: "${ORQ_STREAM:=main}"
: "${ORQ_STREAM_THINKING:=0}"
