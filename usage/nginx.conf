# ai-usage.local -> ai-usage-monitor (opcional). Instalação: docs/usage.md#nginx
#   sudo ln -s ~/.ai-setup/usage/nginx.conf /etc/nginx/sites-available/ai-usage.local
#   sudo ln -s /etc/nginx/sites-available/ai-usage.local /etc/nginx/sites-enabled/
#   echo '127.0.0.1 ai-usage.local' | sudo tee -a /etc/hosts
#   sudo nginx -t && sudo systemctl reload nginx
server {
    # `listen 80` como os outros vhosts: um `listen 127.0.0.1:80` viraria o padrão desse endereço e
    # roubaria os outros *.local. O acesso fica só na máquina pelo allow/deny.
    listen 80;
    server_name ai-usage.local;

    access_log /var/log/nginx/ai-usage.access.log;
    error_log  /var/log/nginx/ai-usage.error.log;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:49381;
        proxy_http_version 1.1;
        # O servidor só aceita Host 127.0.0.1:<porta> (defesa contra DNS rebinding); o nginx já
        # filtrou pelo server_name, então reescreve o Host. Mude a porta junto com `port` no config.
        proxy_set_header Host 127.0.0.1:49381;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
